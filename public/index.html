<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Video to WebVTT Converter</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="container">
      <header>
        <h1>Video to WebVTT Converter</h1>
        <p>Drop a video file below to generate caption subtitles.</p>
      </header>
      <section class="drop-zone" id="drop-zone">
        <input type="file" id="file-input" accept="video/*" hidden />
        <div class="drop-zone__content">
          <p><strong>Drag &amp; drop</strong> a video file here, or</p>
          <button id="browse-button" type="button">Browse for a video</button>
        </div>
      </section>
      <section class="status" id="status" aria-live="polite"></section>
      <section class="download" id="download"></section>
    </main>
    <script src="/app.js" type="module"></script>
  </body>
</html>
